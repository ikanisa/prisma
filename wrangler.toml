# =============================================================================
# Cloudflare Pages Configuration for Prisma Glow
# =============================================================================
# Deployment: Connects to GitHub repo, builds on push to main
# Production URL: https://prisma.pages.dev
# Documentation: /docs/cloudflare/DEPLOYMENT.md
# =============================================================================

name = "prisma"
compatibility_date = "2025-01-03"
compatibility_flags = ["nodejs_compat"]

# Build output directory for @cloudflare/next-on-pages
pages_build_output_dir = "apps/web/.vercel/output/static"

# -----------------------------------------------------------------------------
# Environment Variables (set in Cloudflare Dashboard)
# -----------------------------------------------------------------------------
# Production:
#   - NEXT_PUBLIC_SUPABASE_URL
#   - NEXT_PUBLIC_SUPABASE_ANON_KEY
#   - NEXT_PUBLIC_APP_URL
#   - NEXT_PUBLIC_SENTRY_DSN
#
# Preview:
#   - Same as production but with staging Supabase project
