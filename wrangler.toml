# Cloudflare Pages Configuration
# See: https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "prisma-glow"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Pages build output directory (set by @cloudflare/next-on-pages)
pages_build_output_dir = "apps/web/.vercel/output/static"

# Build configuration for Cloudflare Pages
[build]
command = "pnpm install --frozen-lockfile && pnpm --filter @prisma/web build && pnpm --filter @prisma/web pages:build"

# Production environment (main branch)
[env.production]
vars = { NODE_ENV = "production" }

# Preview/Staging environment (non-main branches)
[env.preview]
vars = { NODE_ENV = "staging" }

# Note: Secrets should be set via Cloudflare Dashboard or wrangler CLI:
# - NEXT_PUBLIC_SUPABASE_URL
# - NEXT_PUBLIC_SUPABASE_ANON_KEY (encrypted)
# - NEXT_PUBLIC_APP_URL
# - NEXT_PUBLIC_SENTRY_DSN (optional, encrypted)
