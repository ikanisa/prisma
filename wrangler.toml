# =============================================================================
# Cloudflare Pages Configuration for Prisma Glow
# =============================================================================
# Deployment: Connects to GitHub repo, builds on push to main
# Production URL: https://prisma.pages.dev
# Documentation: /docs/cloudflare/DEPLOYMENT.md
# =============================================================================

name = "prisma"
compatibility_date = "2025-01-03"
compatibility_flags = ["nodejs_compat"]

# Build output directory for @cloudflare/next-on-pages
# This is where @cloudflare/next-on-pages generates the static output
pages_build_output_dir = "apps/web/.vercel/output/static"

# -----------------------------------------------------------------------------
# Compatibility Date Policy
# -----------------------------------------------------------------------------
# The compatibility_date determines which Workers runtime features are available.
# Update this date periodically (quarterly recommended) to get access to new
# features and performance improvements. Always test thoroughly after updating.
#
# Current date: 2025-01-03
# Next review: 2025-04-01
#
# Documentation: https://developers.cloudflare.com/workers/configuration/compatibility-dates/

# -----------------------------------------------------------------------------
# Node.js Compatibility
# -----------------------------------------------------------------------------
# nodejs_compat is required because Next.js uses Node.js APIs like:
# - node:url (fileURLToPath)
# - node:path (dirname, join)
#
# This flag enables Node.js polyfills in the Workers runtime.
# Bundle size impact: ~200KB (acceptable for Next.js apps)
#
# Documentation: https://developers.cloudflare.com/workers/runtime-apis/nodejs/

# -----------------------------------------------------------------------------
# Environment Variables (set in Cloudflare Dashboard)
# -----------------------------------------------------------------------------
# Production:
#   - NEXT_PUBLIC_SUPABASE_URL
#   - NEXT_PUBLIC_SUPABASE_ANON_KEY
#   - NEXT_PUBLIC_APP_URL
#   - NEXT_PUBLIC_SENTRY_DSN
#   - OPENAI_APP_OAUTH_CLIENT_ID (encrypted)
#   - OPENAI_APP_OAUTH_CLIENT_SECRET (encrypted)
#
# Preview:
#   - Same as production but with staging Supabase project
#
# See docs/deploy/env-matrix.md for complete environment variable reference.
