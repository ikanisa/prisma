# =============================================================================
# Production Docker Compose Configuration
# =============================================================================
# SECURITY NOTICE:
# - All secrets MUST be provided via environment variables
# - Never commit .env files with actual secrets
# - Use strong, unique passwords for all services
# - Validate required env vars before deployment
# =============================================================================

version: '3.9'
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      # REQUIRED: Set strong database credentials
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    
  redis:
    image: redis:7
    restart: unless-stopped
    # TODO: Add Redis password in production
    # command: redis-server --requirepass ${REDIS_PASSWORD}
    
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      # REQUIRED: Set strong MinIO credentials
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    restart: unless-stopped
    
  sentry:
    image: getsentry/sentry:latest
    depends_on:
      - postgres
      - redis
    environment:
      # REQUIRED: Sentry configuration
      SENTRY_SECRET_KEY: ${SENTRY_SECRET_KEY:?SENTRY_SECRET_KEY must be set}
      SENTRY_DB_USER: ${SENTRY_DB_USER:-postgres}
      SENTRY_DB_PASSWORD: ${SENTRY_DB_PASSWORD:?SENTRY_DB_PASSWORD must be set}
      SENTRY_DB_HOST: ${SENTRY_DB_HOST:-postgres}
      SENTRY_REDIS_HOST: ${SENTRY_REDIS_HOST:-redis}
    restart: unless-stopped
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    
  gateway:
    image: ${GATEWAY_IMAGE:?GATEWAY_IMAGE must be set}
    depends_on:
      - postgres
      - redis
      - jaeger
    environment:
      # Telemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_SERVICE_NAME: gateway
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      SERVICE_VERSION: ${SERVICE_VERSION:?SERVICE_VERSION must be set}
      # CRITICAL: Security configuration
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:?GATEWAY_ALLOWED_ORIGINS must be set in production}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET must be set}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
    restart: unless-stopped
  rag:
    image: ${RAG_IMAGE:?RAG_IMAGE must be set}
    depends_on:
      - postgres
      - redis
      - jaeger
    environment:
      # Telemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_SERVICE_NAME: rag
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      SERVICE_VERSION: ${SERVICE_VERSION:?SERVICE_VERSION must be set}
      # OpenAI Configuration
      OPENAI_DEFAULT_REASONING_EFFORT: ${OPENAI_DEFAULT_REASONING_EFFORT:-medium}
      OPENAI_DEFAULT_VERBOSITY: ${OPENAI_DEFAULT_VERBOSITY:-normal}
      OPENAI_AGENT_REASONING_EFFORT: ${OPENAI_AGENT_REASONING_EFFORT:-high}
      OPENAI_AGENT_VERBOSITY: ${OPENAI_AGENT_VERBOSITY:-detailed}
      OPENAI_SUMMARY_REASONING_EFFORT: ${OPENAI_SUMMARY_REASONING_EFFORT:-low}
      OPENAI_SUMMARY_VERBOSITY: ${OPENAI_SUMMARY_VERBOSITY:-concise}
      # Cache Configuration
      CACHE_TTL_RAG_SEARCH_SECONDS: ${CACHE_TTL_RAG_SEARCH_SECONDS:-300}
      CACHE_TTL_RAG_IDEMPOTENCY_SECONDS: ${CACHE_TTL_RAG_IDEMPOTENCY_SECONDS:-60}
      CACHE_TTL_RAG_ORG_LOOKUP_SECONDS: ${CACHE_TTL_RAG_ORG_LOOKUP_SECONDS:-600}
      CACHE_TTL_RAG_DRIVE_UPLOADER_SECONDS: ${CACHE_TTL_RAG_DRIVE_UPLOADER_SECONDS:-120}
      # CRITICAL: Security configuration
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL must be set}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY must be set}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:?API_ALLOWED_ORIGINS must be set in production}
    restart: unless-stopped
  agent:
    image: ${AGENT_IMAGE:?AGENT_IMAGE must be set}
    depends_on:
      - postgres
      - redis
      - jaeger
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_SERVICE_NAME: agent
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      SERVICE_VERSION: ${SERVICE_VERSION:?SERVICE_VERSION must be set}
    restart: unless-stopped
    
  analytics:
    image: ${ANALYTICS_IMAGE:?ANALYTICS_IMAGE must be set}
    depends_on:
      - postgres
      - redis
      - jaeger
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_SERVICE_NAME: analytics
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      SERVICE_VERSION: ${SERVICE_VERSION:?SERVICE_VERSION must be set}
    restart: unless-stopped
    
  ui:
    profiles: ["ui"]
    image: ${UI_IMAGE:?UI_IMAGE must be set}
    depends_on:
      - gateway
    ports:
      - "3000:3000"
    restart: unless-stopped
    
  web:
    profiles: ["web"]
    image: ${WEB_IMAGE:?WEB_IMAGE must be set}
    depends_on:
      - gateway
    ports:
      - "3000:3000"
    restart: unless-stopped
    
volumes:
  postgres-data:
