# Mypy Configuration for Python Type Checking
# P3-3 FIX: Add mypy to CI for Python type hints

[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
ignore_missing_imports = True
follow_imports = silent
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True
pretty = True

# Exclude virtual environments and build artifacts
exclude = (?x)(
    ^\.venv/
    | ^venv/
    | ^\.git/
    | ^__pycache__/
    | ^build/
    | ^dist/
    | ^\.eggs/
    | ^node_modules/
  )

# Server-specific settings
[mypy-server.*]
disallow_untyped_defs = False
check_untyped_defs = True

[mypy-server.agents.*]
disallow_untyped_defs = False
check_untyped_defs = True

# Allow untyped calls to external libraries
[mypy-httpx.*]
ignore_missing_imports = True

[mypy-structlog.*]
ignore_missing_imports = True

[mypy-openai.*]
ignore_missing_imports = True

[mypy-anthropic.*]
ignore_missing_imports = True

[mypy-supabase.*]
ignore_missing_imports = True

[mypy-google.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-uvicorn.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True
