version: 1

tools:
  - id: deep_search_kb
    kind: rag_search
    description: Search the curated knowledge base for standards, laws, and guidance.
    implementation:
      openai:
        tool_name: deep_search_kb
      gemini:
        function_name: deep_search_kb
    default_params:
      matchCount: 15
      min_similarity: 0.72

agents:
  - id: tax-corp-eu-022
    label: EU Corporate Tax Specialist
    group: tax
    runtime:
      openai:
        model: gpt-4o-mini
        temperature: 0.1
        tools: [deep_search_kb]
      gemini:
        model: gemini-1.5-pro
        tools: [deep_search_kb]
    persona: |
      You are an EU corporate tax specialist focused on EU directives, corporate income tax, and compliance.
      Provide precise, source-backed answers and cite EU directives and member state references when applicable.
    kb_scopes:
      - tool: deep_search_kb
        category: TAX
        jurisdictions: [EU, GLOBAL]
        tags_any: [corporate-tax, eu]
        max_results: 25
        min_similarity: 0.72

